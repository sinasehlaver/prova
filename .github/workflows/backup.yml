# Daily encrypted DB backup -> release asset in a PRIVATE repo (this repo is public: never store backups here).
# Setup + restore: DEPLOY.md "4. Backups". A failed run emails the repo owner.
name: backup
on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC = 05:17 Istanbul
  workflow_dispatch:
permissions: {}
concurrency: backup
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.BACKUP_DATABASE_AUTH_TOKEN }} # Turso read-only token
      BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
      GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }} # fine-grained PAT: Contents RW on the backups repo only
      BACKUP_REPO: ${{ secrets.BACKUP_REPO }} # e.g. sinasehlaver/prova-backups (private)
      KEEP: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --omit=dev
      - name: Dump + encrypt
        run: node scripts/backup.mjs "prova-$(date -u +%F).bak.enc"
      - name: Upload (replace today's, prune old)
        run: |
          tag="backup-$(date -u +%F)"
          gh release delete "$tag" --repo "$BACKUP_REPO" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" "prova-$(date -u +%F).bak.enc" --repo "$BACKUP_REPO" --title "$tag" --notes "encrypted prova DB dump"
          gh release list --repo "$BACKUP_REPO" --limit 200 --json tagName --jq '.[].tagName' | grep '^backup-' | sort -r | tail -n +$((KEEP+1)) |
            while read -r t; do gh release delete "$t" --repo "$BACKUP_REPO" --cleanup-tag --yes; done
